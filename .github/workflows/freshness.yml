name: Freshness

on:
  schedule:
    - cron: "23 12 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-brief:
    name: Weekly brief is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check weekly brief age
        run: python3 scripts/check_freshness.py --max-age-days 8
