name: Freshness

on:
  schedule:
    - cron: "23 12 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-brief:
    name: Weekly brief is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Check weekly brief age
        run: python3 scripts/check_freshness.py --max-age-days 8
