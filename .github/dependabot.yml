version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:30"
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /examples/aws/kms-multi-region
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /examples/aws/s3-same-day-ia
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
